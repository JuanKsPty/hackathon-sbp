<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEAF8"/>
      <stop offset="0.65" stop-color="#F3F8FD"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="barrido" cx="600" cy="420" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A9D8F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A9D8F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fachada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECF5"/>
    </linearGradient>
    <linearGradient id="columna" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D7E6"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B7C8DB"/>
    </linearGradient>
    <linearGradient id="moneda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D774"/>
      <stop offset="0.55" stop-color="#E2B33A"/>
      <stop offset="1" stop-color="#B9861C"/>
    </linearGradient>
    <linearGradient id="cantoMoneda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C6E12"/>
      <stop offset="1" stop-color="#C99A2E"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2545" flood-opacity="0.18"/>
    </filter>
    <filter id="sombraSuave" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B2545" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="muro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB6CF"/><stop offset="1" stop-color="#C6D5E6"/></linearGradient>
    <clipPath id="recorte"><rect width="1200" height="640"/></clipPath>
    <symbol id="monedaSimbolo" viewBox="-40 -40 80 80">
      <ellipse cx="0" cy="5" rx="34" ry="34" fill="url(#cantoMoneda)"/>
      <circle cx="0" cy="0" r="34" fill="url(#moneda)"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#FFF2C2" stroke-width="3" opacity="0.8"/>
      <path d="M-12 12 L-12 -2 M0 12 L0 -10 M12 12 L12 4" stroke="#8A5E0B" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M-22 -16 A26 26 0 0 1 4 -27" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    </symbol>
  </defs>

  <g clip-path="url(#recorte)">
    <!-- cielo y cuadrícula de datos -->
    <rect width="1200" height="640" fill="url(#cielo)"/>
    <g stroke="#1B6CA8" stroke-opacity="0.07" stroke-width="1">
      <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
      <path d="M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520"/>
    </g>

    <!-- horizonte de ciudad (siluetas genéricas) -->
    <g fill="#B9CDE2" opacity="0.75">
      <rect x="40" y="300" width="70" height="230"/>
      <rect x="120" y="250" width="56" height="280"/>
      <rect x="186" y="320" width="80" height="210"/>
      <rect x="930" y="270" width="64" height="260"/>
      <rect x="1004" y="215" width="58" height="315"/>
      <rect x="1072" y="300" width="90" height="230"/>
    </g>
    <g fill="#FFFFFF" opacity="0.55">
      <rect x="132" y="270" width="8" height="10"/><rect x="150" y="270" width="8" height="10"/><rect x="132" y="296" width="8" height="10"/><rect x="150" y="296" width="8" height="10"/><rect x="132" y="322" width="8" height="10"/><rect x="150" y="322" width="8" height="10"/>
      <rect x="1016" y="238" width="8" height="10"/><rect x="1036" y="238" width="8" height="10"/><rect x="1016" y="264" width="8" height="10"/><rect x="1036" y="264" width="8" height="10"/><rect x="1016" y="290" width="8" height="10"/><rect x="1036" y="290" width="8" height="10"/>
    </g>

    <!-- radar: anillos, barrido y señales -->
    <g fill="none" stroke="#1B6CA8">
      <circle cx="600" cy="420" r="330" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="600" cy="420" r="260" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="600" cy="420" r="190" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M270 420H930M600 90V420" stroke-opacity="0.10" stroke-width="2"/>
    </g>
    <path d="M600 420 L600 90 A330 330 0 0 1 885 255 Z" fill="url(#barrido)"/>
    <path d="M600 420 L885 255" stroke="#2A9D8F" stroke-width="3" stroke-opacity="0.8"/>
    <g>
      <circle cx="790" cy="230" r="22" fill="#2A9D8F" opacity="0.18"/>
      <circle cx="790" cy="230" r="9" fill="#2A9D8F"/>
      <circle cx="420" cy="200" r="16" fill="#1B6CA8" opacity="0.15"/>
      <circle cx="420" cy="200" r="6" fill="#1B6CA8" opacity="0.7"/>
      <circle cx="700" cy="150" r="5" fill="#1B6CA8" opacity="0.5"/>
    </g>

    <!-- suelo -->
    <path d="M0 520 H1200 V640 H0 Z" fill="#EEF3F8"/>
    <ellipse cx="600" cy="560" rx="360" ry="30" fill="#0B2545" opacity="0.10"/>

    <!-- edificio neoclásico (banco ficticio) -->
    <g filter="url(#sombra)">
      <!-- escalinata -->
      <rect x="350" y="512" width="500" height="22" rx="3" fill="#D3DFEB"/>
      <rect x="372" y="494" width="456" height="20" rx="3" fill="#E1EAF3"/>
      <rect x="392" y="478" width="416" height="18" rx="3" fill="#ECF2F8"/>
      <!-- base -->
      <rect x="408" y="458" width="384" height="22" fill="url(#fachada)" stroke="#0B2545" stroke-opacity="0.10"/>
      <!-- muro interior (detrás de las columnas) -->
      <rect x="440" y="300" width="320" height="150" fill="url(#muro)"/>
      <!-- columnas -->
      <g>
        <rect x="430" y="300" width="34" height="158" fill="url(#columna)"/>
        <rect x="502" y="300" width="34" height="158" fill="url(#columna)"/>
        <rect x="583" y="300" width="34" height="158" fill="url(#columna)"/>
        <rect x="664" y="300" width="34" height="158" fill="url(#columna)"/>
        <rect x="736" y="300" width="34" height="158" fill="url(#columna)"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="424" y="290" width="46" height="12" rx="2"/>
        <rect x="496" y="290" width="46" height="12" rx="2"/>
        <rect x="577" y="290" width="46" height="12" rx="2"/>
        <rect x="658" y="290" width="46" height="12" rx="2"/>
        <rect x="730" y="290" width="46" height="12" rx="2"/>
        <rect x="424" y="448" width="46" height="12" rx="2"/>
        <rect x="496" y="448" width="46" height="12" rx="2"/>
        <rect x="577" y="448" width="46" height="12" rx="2"/>
        <rect x="658" y="448" width="46" height="12" rx="2"/>
        <rect x="730" y="448" width="46" height="12" rx="2"/>
      </g>
      <!-- muro interior entre columnas -->
      
      <!-- arquitrabe -->
      <rect x="400" y="262" width="400" height="30" fill="url(#fachada)"/>
      <rect x="400" y="262" width="400" height="6" fill="#C9D7E6"/>
      <!-- frontón -->
      <path d="M390 264 L600 168 L810 264 Z" fill="#FFFFFF" stroke="#0B2545" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round"/>
      <path d="M424 254 L600 182 L776 254 Z" fill="#E8EFF7"/>
      <!-- emblema ficticio: pequeño radar -->
      <circle cx="600" cy="226" r="20" fill="#0B2545"/>
      <circle cx="600" cy="226" r="13" fill="none" stroke="#7FB2E5" stroke-width="2"/>
      <path d="M600 226 L611 216" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="600" cy="226" r="3" fill="#FFFFFF"/>
    </g>

    <!-- tarjeta: barras que suben -->
    <g filter="url(#sombraSuave)" transform="translate(140 120) rotate(-6)">
      <rect width="190" height="132" rx="16" fill="#FFFFFF"/>
      <rect x="22" y="22" width="70" height="9" rx="4.5" fill="#C9D7E6"/>
      <rect x="22" y="86" width="22" height="26" rx="4" fill="#B9CDE2"/>
      <rect x="54" y="70" width="22" height="42" rx="4" fill="#7FB2E5"/>
      <rect x="86" y="58" width="22" height="54" rx="4" fill="#1B6CA8"/>
      <rect x="118" y="44" width="22" height="68" rx="4" fill="#0B2545"/>
      <path d="M150 52 L170 30 M170 30 L156 31 M170 30 L169 44" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- tarjeta: ranking con posición que sube -->
    <g filter="url(#sombraSuave)" transform="translate(880 96) rotate(5)">
      <rect width="196" height="150" rx="16" fill="#FFFFFF"/>
      <g>
        <circle cx="30" cy="34" r="11" fill="#0B2545"/><rect x="50" y="29" width="96" height="10" rx="5" fill="#C9D7E6"/>
        <circle cx="30" cy="74" r="11" fill="#1B6CA8"/><rect x="50" y="69" width="80" height="10" rx="5" fill="#C9D7E6"/>
        <circle cx="30" cy="114" r="11" fill="#7FB2E5"/><rect x="50" y="109" width="64" height="10" rx="5" fill="#C9D7E6"/>
      </g>
      <rect x="140" y="62" width="42" height="24" rx="12" fill="#E5F4EA"/>
      <path d="M152 79 L161 68 L170 79 Z" fill="#1E7B34"/>
    </g>

    <!-- monedas flotando -->
    <use href="#monedaSimbolo" x="230" y="300" width="84" height="84" transform="rotate(-14 272 342)"/>
    <use href="#monedaSimbolo" x="330" y="40" width="64" height="64" transform="rotate(10 362 72)"/>
    <use href="#monedaSimbolo" x="840" y="300" width="96" height="96" transform="rotate(12 888 348)"/>
    <use href="#monedaSimbolo" x="980" y="20" width="56" height="56" transform="rotate(-8 1008 48)"/>
    <use href="#monedaSimbolo" x="560" y="40" width="50" height="50" transform="rotate(18 585 65)"/>
    <use href="#monedaSimbolo" x="740" y="330" width="46" height="46" transform="rotate(-20 763 353)"/>

    <!-- árboles estilizados -->
    <g>
      <rect x="318" y="470" width="8" height="48" rx="3" fill="#5B7A99"/>
      <circle cx="322" cy="458" r="30" fill="#2A9D8F"/>
      <circle cx="306" cy="470" r="18" fill="#238A7E"/>
      <rect x="872" y="470" width="8" height="48" rx="3" fill="#5B7A99"/>
      <circle cx="876" cy="458" r="30" fill="#2A9D8F"/>
      <circle cx="893" cy="470" r="18" fill="#238A7E"/>
    </g>
  </g>
</svg>
