# Sitio PÚBLICO (sbp.juank.tech): SPA sin login y proxy del API solo para las rutas públicas.
# Se copia a /etc/nginx/conf.d/default.conf cuando SITIO=publico (client/Dockerfile).
# Protocolo original: Traefik (Dokploy) termina el HTTPS y manda X-Forwarded-Proto. El API lo usa
# para marcar la cookie de sesión como Secure. En local (sin Traefik) queda el de nginx.
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sin cargas de archivos en el sitio público.
  client_max_body_size 1m;

  # Encabezados de seguridad (los repite location / porque add_header no se hereda si la location
  # tiene los suyos).
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/csv application/json application/javascript text/javascript image/svg+xml;

  # DNS interno de Docker: el nombre sbp-server se resuelve en cada petición,
  # así nginx sigue funcionando si el contenedor del API se reinicia y cambia de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API: solo una lista blanca de rutas públicas; todo lo demás es 404 (las de Analista y
  # Administrador viven en el sitio interno). El API además trata todo lo que llega con
  # X-Sitio: publico como perfil Público.
  # Consultas y descargas abiertas: solo GET y HEAD.
  location ~ ^/api/(salud|perfil|parametros|periodos|catalogos|rankings|subactividades|calidad|excluidas|indicadores|verificacion|ia/guia|ia/estado|openapi\.json|exportar/(rankings|subactividades|calidad|excluidas|alertas)\.csv|exportar/dashboard\.html|suscripciones/(confirmar|baja))$ {
    limit_except GET { deny all; }
    set $destino_api http://sbp-server:3001;
    # Sin URI después del host: la ruta /api/... y la query llegan tal cual al API.
    proxy_pass $destino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El sitio lo fija nginx, nunca el navegador: el API decide con él si acepta la sesión.
    proxy_set_header X-Sitio publico;
    # Header interno del server (agente de IA y MCP): nunca llega desde afuera.
    proxy_set_header X-Sbp-Interno "";
    # El sitio público no tiene sesión: no pasan cookies ni tokens.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Las explicaciones con IA pueden tardar.
    proxy_read_timeout 120s;
  }

  # Documentación del API (Swagger UI y sus archivos).
  location ~ ^/api/docs(/.*)?$ {
    limit_except GET { deny all; }
    set $destino_api http://sbp-server:3001;
    # Sin URI después del host: la ruta /api/... y la query llegan tal cual al API.
    proxy_pass $destino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El sitio lo fija nginx, nunca el navegador: el API decide con él si acepta la sesión.
    proxy_set_header X-Sitio publico;
    # Header interno del server (agente de IA y MCP): nunca llega desde afuera.
    proxy_set_header X-Sbp-Interno "";
    # El sitio público no tiene sesión: no pasan cookies ni tokens.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Las explicaciones con IA pueden tardar.
    proxy_read_timeout 120s;
  }

  # Chat con IA, MCP remoto (siempre como Público), alta de suscripciones y reporte por correo: solo POST.
  location ~ ^/api/(ia/preguntar|mcp|suscripciones|reportes/correo)$ {
    limit_except POST { deny all; }
    set $destino_api http://sbp-server:3001;
    # Sin URI después del host: la ruta /api/... y la query llegan tal cual al API.
    proxy_pass $destino_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El sitio lo fija nginx, nunca el navegador: el API decide con él si acepta la sesión.
    proxy_set_header X-Sitio publico;
    # Header interno del server (agente de IA y MCP): nunca llega desde afuera.
    proxy_set_header X-Sbp-Interno "";
    # El sitio público no tiene sesión: no pasan cookies ni tokens.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Las explicaciones con IA pueden tardar.
    proxy_read_timeout 120s;
  }

  location /api/ {
    default_type application/json;
    return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"Esta ruta no existe en el sitio público."}}';
  }

  # Archivos con hash en el nombre: se pueden guardar en caché un año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker (#8): siempre se revisa con el servidor, para que las versiones nuevas lleguen.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Manifest de la web app instalable (#8), con su tipo propio.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # El MCP remoto (/api/mcp, #81) no usa login. Los clientes MCP (por ejemplo los conectores de
  # Claude) buscan metadatos de OAuth en /.well-known/... y, si reciben 200 (el index.html del SPA),
  # creen que hay que iniciar sesión y fallan al registrarse. Estas rutas no son de la app: 404.
  location ^~ /.well-known/ {
    default_type application/json;
    return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"No hay metadatos de OAuth: el MCP no requiere inicio de sesión."}}';
  }
  location ~ ^/(register|authorize|token)/?$ {
    default_type application/json;
    return 404 '{"error":{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"No hay OAuth en esta app."}}';
  }

  # SPA: cualquier ruta del client (/rankings, /calidad, ...) carga index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
