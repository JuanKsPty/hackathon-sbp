<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- Web app instalable en el celular (#8). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rankings" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Rankings de crédito por banco y actividad económica a partir de datos AT03 sintéticos. Datos ficticios · Uso informativo, no opinión formal de la SBP." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rankings de Crédito" />
    <meta property="og:description" content="Rankings de crédito por banco y actividad económica · Hackathon SBP 2026 · Datos ficticios" />
    <meta property="og:image" content="/marca/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Rankings de Crédito</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello claro en modo oscuro.
      try {
        var tema = localStorage.getItem('rankings.tema') || 'sistema'
        var oscuro = tema === 'oscuro' || (tema === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F141A')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
